<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocheras Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{display:flex;justify-content:center;background:var(--color-background-tertiary);}
  .calc{font-family:'Syne',sans-serif;width:400px;background:var(--color-background-primary);border:1.5px solid var(--color-border-secondary);border-radius:18px;overflow:hidden;margin:20px auto;}
  .calc-header{background:#1a1a2e;padding:12px 16px 10px;display:flex;align-items:center;gap:10px;}
  .calc-header svg{width:22px;height:22px;flex-shrink:0;}
  .calc-header h1{font-size:14px;font-weight:700;color:#fff;}
  .calc-header p{font-size:9px;color:rgba(255,255,255,0.45);font-family:'JetBrains Mono',monospace;margin-top:1px;}
  .summary-bar{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1.5px solid var(--color-border-secondary);}
  .sum-cell{padding:9px 12px;border-right:0.5px solid var(--color-border-tertiary);text-align:center;}
  .sum-cell:last-child{border-right:none;}
  .sum-label{font-size:9px;color:var(--color-text-tertiary);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.4px;}
  .sum-val{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--color-text-primary);margin-top:2px;}
  .sum-val.green{color:#1D9E75;}
  .sum-val.amber{color:#BA7517;}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid var(--color-border-secondary);}
  .tab-btn{padding:10px 0;font-family:'Syne',sans-serif;font-size:12px;font-weight:500;background:var(--color-background-secondary);color:var(--color-text-secondary);border:none;cursor:pointer;border-bottom:2.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px;}
  .tab-btn:first-child{border-right:0.5px solid var(--color-border-tertiary);}
  .tab-btn.active{background:var(--color-background-primary);color:#2a4abf;border-bottom-color:#2a4abf;}
  .tab-btn.active.amber-tab{color:#c07010;border-bottom-color:#e8a84a;}
  .tab-btn svg{width:13px;height:13px;flex-shrink:0;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* PLAZAS */
  .plaza-sep{display:flex;align-items:center;gap:0;background:#eef2ff;padding:6px 12px;border-bottom:0.5px solid #c5d0f0;border-top:0.5px solid #c5d0f0;}
  @media(prefers-color-scheme:dark){
    .plaza-sep{background:#1c2245;border-color:#2a3568;}
    .sep-num-input,.sep-name-input{color:#8ba4e8!important;background:#1c2245!important;border-color:#2a3568!important;}
    .sep-estado.ocupada{background:#0e3326!important;color:#4ecb97!important;}
    .sep-estado.libre{background:#2a2a2a!important;color:#888!important;}
    .sep-estado.pendiente{background:#3a2a00!important;color:#e0a030!important;}
  }
  .sep-num-input{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#2a4abf;width:52px;background:#eef2ff;border:0.5px solid transparent;border-radius:5px;padding:2px 4px;}
  .sep-num-input:focus{outline:none;border-color:#2a4abf;background:#fff;}
  .sep-name-input{font-size:13px;font-weight:500;color:#2a4abf;flex:1;background:#eef2ff;border:0.5px solid transparent;border-radius:5px;padding:2px 6px;font-family:'Syne',sans-serif;margin:0 6px;}
  .sep-name-input:focus{outline:none;border-color:#2a4abf;background:#fff;}
  .sep-name-input::placeholder{color:#aab5e0;font-style:italic;}
  .sep-estado{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 8px;border-radius:4px;background:#dce8fc;color:#2a4abf;flex-shrink:0;}
  .sep-estado.ocupada{background:#dcf5ec;color:#0F6E56;}
  .sep-estado.libre{background:#eeeee8;color:#5F5E5A;}
  .sep-estado.pendiente{background:#faeeda;color:#854F0B;}
  .btn-del{background:none;border:none;cursor:pointer;color:#c0c8e0;padding:2px 4px;border-radius:4px;font-size:14px;line-height:1;flex-shrink:0;}
  .btn-del:hover{color:#e24b4a;background:#fcebeb;}

  .plaza-fields{display:grid;grid-template-columns:1fr 1fr;padding:10px 12px 6px;border-bottom:1.5px solid var(--color-border-secondary);}
  .pf{padding:3px 5px;}
  .pf-label{font-size:9px;color:var(--color-text-tertiary);font-family:'JetBrains Mono',monospace;text-transform:uppercase;margin-bottom:3px;}
  .pf-input{font-family:'Syne',sans-serif;font-size:12px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:5px;padding:5px 8px;width:100%;color:var(--color-text-primary);}
  .pf-input:focus{outline:none;border-color:#2a4abf;}
  select.pf-input{cursor:pointer;}
  .key-row{display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:5px;padding:5px 8px;}
  .key-row input{accent-color:#1D9E75;cursor:pointer;width:13px;height:13px;flex-shrink:0;}
  .key-row span{font-size:11px;color:var(--color-text-secondary);font-family:'JetBrains Mono',monospace;}
  .key-row.has-key span{color:#1D9E75;}

  .obs-row{padding:4px 17px 10px;border-bottom:1.5px solid var(--color-border-secondary);}
  .obs-textarea{
    font-family:'Syne',sans-serif;font-size:12px;
    background:var(--color-background-secondary);
    border:0.5px solid var(--color-border-tertiary);
    border-radius:5px;padding:6px 8px;width:100%;
    color:var(--color-text-primary);resize:none;height:46px;line-height:1.4;
  }
  .obs-textarea:focus{outline:none;border-color:#2a4abf;}
  .obs-textarea::placeholder{color:var(--color-text-tertiary);font-style:italic;}

  .btn-nueva{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 24px);margin:10px 12px;padding:9px;font-family:'Syne',sans-serif;font-size:12px;font-weight:500;background:none;color:#2a4abf;border:1px dashed #8ba4e8;border-radius:8px;cursor:pointer;}
  .btn-nueva:hover{background:#eef2ff;border-color:#2a4abf;}
  .btn-nueva svg{width:14px;height:14px;}

  /* PAGOS */
  .pagos-panel{background:#fff8f0;padding:14px 12px;}
  @media(prefers-color-scheme:dark){
    .pagos-panel{background:#241c0a;}
    .pagos-panel .pf-input{background:#2a1f0a;border-color:#4a3010;color:#f0d090;}
    .pagos-panel .pf-input:focus{border-color:#e8a84a;}
  }
  .pagos-header{display:flex;align-items:center;gap:7px;margin-bottom:12px;}
  .pagos-icon{width:22px;height:22px;background:#e8a84a;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pagos-icon svg{width:13px;height:13px;}
  .pagos-title{font-size:12px;font-weight:700;color:#a06010;}
  .pago-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
  .pago-row2{display:grid;grid-template-columns:2fr 1fr;gap:6px;}
  .pagos-panel .pf-input{background:#fff3e0;border:0.5px solid #e8c07a;}
  .btn-pago{width:100%;padding:8px;font-family:'Syne',sans-serif;font-size:12px;font-weight:500;background:#e8a84a;color:#fff;border:none;border-radius:6px;cursor:pointer;}
  .btn-pago:hover{opacity:0.85;}

  /* Mes+Año combinado */
  .mes-anio-wrap{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
  .mes-anio-wrap select{font-size:11px;}

  .hist-section{padding:12px 12px 0;border-top:1.5px solid #f0d090;}
  @media(prefers-color-scheme:dark){.hist-section{border-top-color:#4a3010;}}
  .hist-section-title{font-size:9px;font-weight:500;color:#a06010;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
  .hist-scroll{max-height:220px;overflow-y:auto;}
  .hist-table{width:100%;border-collapse:collapse;font-size:11px;font-family:'JetBrains Mono',monospace;table-layout:fixed;}
  .hist-table th{text-align:left;font-size:9px;color:#b08040;font-weight:400;text-transform:uppercase;letter-spacing:0.4px;padding:0 5px 6px;border-bottom:0.5px solid #f0d090;}
  .hist-table td{padding:6px 5px;border-bottom:0.5px solid rgba(200,150,80,0.15);color:#7a5020;vertical-align:middle;}
  @media(prefers-color-scheme:dark){
    .hist-table th{color:#806040;border-bottom-color:#4a3010;}
    .hist-table td{color:#c0a070;}
  }
  .hist-table tr:hover td{background:rgba(232,168,74,0.06);}
  .col-fecha{width:62px;}
  .col-pza{width:30px;}
  .col-inq{width:auto;}
  .col-eur{width:38px;text-align:right!important;}
  .col-est{width:72px;}
  .col-del{width:24px;text-align:center;}
  .badge-cobrado{background:#dcf5ec;color:#0F6E56;padding:2px 5px;border-radius:3px;font-size:9px;white-space:nowrap;}
  .badge-pend{background:#faeeda;color:#854F0B;padding:2px 5px;border-radius:3px;font-size:9px;white-space:nowrap;}
  .empty-hist{text-align:center;color:#b08040;font-size:11px;font-family:'JetBrains Mono',monospace;padding:20px 0;}
  .btn-del-pago{background:none;border:none;cursor:pointer;color:#d0a870;font-size:13px;line-height:1;padding:2px 3px;border-radius:4px;}
  .btn-del-pago:hover{color:#e24b4a;background:#fcebeb;}

  .actions-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px 12px;border-top:1.5px solid var(--color-border-secondary);background:var(--color-background-primary);}
  .btn-save{padding:9px;font-family:'Syne',sans-serif;font-size:12px;font-weight:500;background:#1a1a2e;color:#fff;border:none;border-radius:7px;cursor:pointer;}
  .btn-save:hover{opacity:0.85;}
  .btn-excel{padding:9px;font-family:'Syne',sans-serif;font-size:12px;font-weight:500;background:#185F2E;color:#fff;border:none;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
  .btn-excel:hover{opacity:0.85;}

  .confirm-wrap{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.35);z-index:10;align-items:center;justify-content:center;}
  .confirm-wrap.show{display:flex;}
  .confirm-box{background:var(--color-background-primary);border:1.5px solid var(--color-border-secondary);border-radius:12px;padding:20px 20px 16px;width:260px;text-align:center;}
  .confirm-box p{font-size:13px;color:var(--color-text-primary);margin-bottom:14px;line-height:1.5;}
  .confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .cbtn{padding:8px;border:none;border-radius:7px;cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;font-weight:500;}
  .cbtn-cancel{background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary);}
  .cbtn-del{background:#e24b4a;color:#fff;}
  .panel-cocheras-inner{position:relative;}

  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;padding:8px 18px;border-radius:8px;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;}

  /* Sync status */
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#888;display:inline-block;margin-left:6px;vertical-align:middle;}
  .sync-dot.ok{background:#1D9E75;}
  .sync-dot.err{background:#e24b4a;}
  .sync-dot.syncing{background:#e8a84a;animation:pulse 0.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
</style>

      Cocheras

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ─── SUPABASE CONFIG ────────────────────────────────────────────────────────
const SB_URL  = 'https://kcpmaxnfjmxsvvdeqmhy.supabase.co';
const SB_KEY  = 'sb_publishable_x5n8nobY-gpZiJRbeJBBjQ_LIqInNs9';
const HEADERS = {
  'Content-Type': 'application/json',
  'apikey': SB_KEY,
  'Authorization': `Bearer ${SB_KEY}`,
  'Prefer': 'return=representation'
};

async function sbGet(table) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?select=*`, { headers: HEADERS });
  if (!r.ok) throw new Error(`GET ${table}: ${r.status}`);
  return r.json();
}
async function sbUpsert(table, rows) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { ...HEADERS, 'Prefer': 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify(rows)
  });
  if (!r.ok) { const t = await r.text(); throw new Error(`UPSERT ${table}: ${r.status} ${t}`); }
  return r.json();
}
async function sbDelete(table, col, val) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${col}=eq.${encodeURIComponent(val)}`, {
    method: 'DELETE',
    headers: HEADERS
  });
  if (!r.ok) throw new Error(`DELETE ${table}: ${r.status}`);
}
async function sbPatch(table, col, val, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${col}=eq.${encodeURIComponent(val)}`, {
    method: 'PATCH',
    headers: HEADERS,
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(`PATCH ${table}: ${r.status}`);
}

// ─── ESTADO ─────────────────────────────────────────────────────────────────
const SK = 'cocheras_v7';
const DEF = [
  {id:'165',inquilino:'Anabel',renta:80,estado:'ocupada',llave:false,obs:''},
  {id:'164',inquilino:'Héctor',renta:80,estado:'ocupada',llave:false,obs:''},
  {id:'57', inquilino:'',      renta:0, estado:'libre',  llave:false,obs:''},
];
let plazas, pagos, pendingDelIdx = null;

// LocalStorage como caché local
try {
  const s = JSON.parse(localStorage.getItem(SK));
  if (s && s.plazas) {
    plazas = s.plazas.map(p => ({obs:'',...p}));
    pagos  = s.pagos || [];
  } else throw 0;
} catch(e) {
  plazas = JSON.parse(JSON.stringify(DEF));
  pagos  = [];
}

function saveLocal() {
  try { localStorage.setItem(SK, JSON.stringify({plazas, pagos})); } catch(e) {}
}

// ─── SYNC DOT ────────────────────────────────────────────────────────────────
function setSyncDot(state) {
  const d = document.getElementById('sync-dot');
  d.className = 'sync-dot ' + state;
}

// ─── GUARDAR EN SUPABASE ─────────────────────────────────────────────────────
async function saveToSupabase() {
  setSyncDot('syncing');
  try {
    // Upsert cocheras
    const cochRows = plazas.map(p => ({
      id: p.id,
      inquilino: p.inquilino || '',
      renta: parseFloat(p.renta) || 0,
      estado: p.estado,
      llave: !!p.llave,
      obs: p.obs || ''
    }));
    await sbUpsert('cocheras', cochRows);

    // Upsert pagos (los que tienen id uuid los actualizamos, los nuevos los insertamos)
    if (pagos.length) {
      const pagoRows = pagos.map(p => {
        const row = {
          plaza: p.plaza,
          nombre: p.nombre || '—',
          mes: p.mes,
          importe: parseFloat(p.importe),
          cobrado: !!p.cobrado
        };
        if (p.sb_id) row.id = p.sb_id;
        return row;
      });
      const res = await sbUpsert('pagos', pagoRows);
      // Guardar los ids devueltos por supabase
      if (Array.isArray(res)) {
        res.forEach((row, i) => {
          if (pagos[i] && row.id) pagos[i].sb_id = row.id;
        });
      }
    }

    saveLocal();
    setSyncDot('ok');
    toast('Guardado en Supabase ✓', '#1D9E75');
  } catch(err) {
    setSyncDot('err');
    toast('Error Supabase: ' + err.message, '#e24b4a');
    console.error(err);
  }
}

// ─── CARGAR DESDE SUPABASE ───────────────────────────────────────────────────
async function loadFromSupabase() {
  setSyncDot('syncing');
  try {
    const [dbCocheras, dbPagos] = await Promise.all([
      sbGet('cocheras'),
      sbGet('pagos')
    ]);
    if (dbCocheras.length) {
      plazas = dbCocheras.map(p => ({obs:'',...p}));
      pagos  = dbPagos.map(p => ({...p, sb_id: p.id}));
      saveLocal();
    }
    setSyncDot('ok');
    renderPlazas(); renderHist(); updateSummary(); refreshPagoSelect();
  } catch(err) {
    setSyncDot('err');
    toast('Sin conexión, usando caché local', '#BA7517');
    console.error(err);
    renderPlazas(); renderHist(); updateSummary(); refreshPagoSelect();
  }
}

// ─── UI HELPERS ──────────────────────────────────────────────────────────────
function toast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color || '#1a1a2e';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500);
}
function switchTab(tab) {
  document.getElementById('panel-cocheras').classList.toggle('active', tab==='cocheras');
  document.getElementById('panel-pagos').classList.toggle('active', tab==='pagos');
  document.getElementById('tab-cocheras').classList.toggle('active', tab==='cocheras');
  document.getElementById('tab-pagos').classList.toggle('active', tab==='pagos');
  if (tab==='pagos') refreshPagoSelect();
}
function updateSummary() {
  const oc  = plazas.filter(p => p.estado==='ocupada').length;
  const ing = plazas.filter(p => p.estado==='ocupada').reduce((s,p) => s+(parseFloat(p.renta)||0), 0);
  const ll  = plazas.filter(p => p.llave).length;
  document.getElementById('s-ocup').textContent = `${oc}/${plazas.length}`;
  document.getElementById('s-ing').textContent  = `${ing}€`;
  document.getElementById('s-llav').textContent = `${ll}/${plazas.length}`;
}
function openConfirm(i) {
  pendingDelIdx = i;
  const p = plazas[i];
  document.getElementById('confirm-name').textContent = `#${p.id}${p.inquilino?' ('+p.inquilino+')':''}`;
  document.getElementById('confirm-wrap').classList.add('show');
}
function closeConfirm() { pendingDelIdx=null; document.getElementById('confirm-wrap').classList.remove('show'); }

document.getElementById('confirm-del-btn').addEventListener('click', async () => {
  if (pendingDelIdx===null) return;
  const pid = plazas[pendingDelIdx].id;
  plazas.splice(pendingDelIdx, 1);
  pagos = pagos.filter(p => p.plaza !== pid);
  closeConfirm();
  // Borrar en supabase (cascade borra pagos)
  try { await sbDelete('cocheras', 'id', pid); } catch(e) { console.error(e); }
  saveLocal(); renderPlazas(); renderHist(); updateSummary(); refreshPagoSelect();
  toast('Cochera eliminada', '#e24b4a');
});

// ─── RENDER PLAZAS ───────────────────────────────────────────────────────────
function renderPlazas() {
  const w = document.getElementById('plazas-wrap'); w.innerHTML = '';
  plazas.forEach((p, i) => {
    const ec = p.estado;
    const el = document.createElement('div');
    el.innerHTML = `
      <div class="plaza-sep">
        <input class="sep-num-input" type="text" value="${p.id}" data-f="id" data-i="${i}" title="Número de plaza" maxlength="8">
        <input class="sep-name-input" type="text" value="${p.inquilino}" data-f="inquilino" data-i="${i}" placeholder="Sin inquilino">
        <span class="sep-estado ${ec}">${ec==='ocupada'?'Ocupada':ec==='libre'?'Libre':'Pendiente'}</span>
        <button class="btn-del" data-del="${i}" title="Eliminar cochera">✕</button>
      </div>
      <div class="plaza-fields">
        <div class="pf">
          <div class="pf-label">Renta €/mes</div>
          <input class="pf-input" type="number" value="${p.renta}" min="0" data-f="renta" data-i="${i}">
        </div>
        <div class="pf">
          <div class="pf-label">Estado</div>
          <select class="pf-input" data-f="estado" data-i="${i}">
            <option value="ocupada" ${ec==='ocupada'?'selected':''}>Ocupada</option>
            <option value="libre" ${ec==='libre'?'selected':''}>Libre</option>
            <option value="pendiente" ${ec==='pendiente'?'selected':''}>Pendiente</option>
          </select>
        </div>
        <div class="pf" style="grid-column:1/-1">
          <div class="pf-label">Llave entregada</div>
          <label class="key-row ${p.llave?'has-key':''}" data-i="${i}">
            <input type="checkbox" data-f="llave" data-i="${i}" ${p.llave?'checked':''}>
            <span>${p.llave?'Entregada':'Pendiente'}</span>
          </label>
        </div>
      </div>
      <div class="obs-row">
        <div class="pf-label">Observaciones</div>
        <textarea class="obs-textarea" data-f="obs" data-i="${i}" placeholder="Notas sobre esta plaza...">${p.obs||''}</textarea>
      </div>`;
    w.appendChild(el);
  });

  w.querySelectorAll('[data-f]').forEach(el => {
    const ev = el.tagName==='TEXTAREA' ? 'input' : 'change';
    el.addEventListener(ev, e => {
      const i = +e.target.dataset.i, f = e.target.dataset.f;
      if (f==='llave') {
        plazas[i].llave = e.target.checked;
        const lbl = e.target.closest('.key-row');
        lbl.classList.toggle('has-key', plazas[i].llave);
        lbl.querySelector('span').textContent = plazas[i].llave ? 'Entregada' : 'Pendiente';
      } else if (f==='renta') {
        plazas[i].renta = parseFloat(e.target.value) || 0;
      } else if (f==='estado') {
        plazas[i].estado = e.target.value;
        const badge = e.target.closest('.plaza-fields').previousElementSibling.querySelector('.sep-estado');
        badge.className = `sep-estado ${plazas[i].estado}`;
        badge.textContent = plazas[i].estado==='ocupada'?'Ocupada':plazas[i].estado==='libre'?'Libre':'Pendiente';
      } else {
        plazas[i][f] = e.target.value;
        if (f==='id' || f==='inquilino') refreshPagoSelect();
      }
      updateSummary();
    });
  });
  w.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => openConfirm(+e.target.dataset.del));
  });
}

function refreshPagoSelect() {
  const sel = document.getElementById('p-plaza');
  const cur = sel.value;
  sel.innerHTML = plazas.map(p => `<option value="${p.id}" ${p.id===cur?'selected':''}>${p.id}${p.inquilino?' – '+p.inquilino:''}</option>`).join('');
}

document.getElementById('btn-nueva').addEventListener('click', () => {
  const newId = String(Math.floor(Math.random()*900)+100);
  plazas.push({id:newId, inquilino:'', renta:0, estado:'libre', llave:false, obs:''});
  saveLocal(); renderPlazas(); updateSummary(); refreshPagoSelect();
  document.getElementById('plazas-wrap').lastElementChild?.scrollIntoView({behavior:'smooth', block:'nearest'});
  toast('Nueva cochera añadida', '#2a4abf');
});

// ─── MES/AÑO DESPLEGABLES ────────────────────────────────────────────────────
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_CORTO = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function buildMesAnioSelects() {
  const selMes  = document.getElementById('p-mes-sel');
  const selAnio = document.getElementById('p-anio-sel');
  const hoy = new Date();
  selMes.innerHTML  = MESES.map((m,i) => `<option value="${String(i+1).padStart(2,'0')}">${m}</option>`).join('');
  const anioBase = hoy.getFullYear();
  selAnio.innerHTML = [-1,0,1,2].map(d => `<option value="${anioBase+d}">${anioBase+d}</option>`).join('');
  selMes.value  = String(hoy.getMonth()+1).padStart(2,'0');
  selAnio.value = String(anioBase);
}

function getMesValor() {
  const m = document.getElementById('p-mes-sel').value;
  const y = document.getElementById('p-anio-sel').value;
  return `${y}-${m}`; // formato YYYY-MM igual que antes
}

function fmtMes(m) {
  if (!m) return '—';
  const [y, mo] = m.split('-');
  return MESES_CORTO[+mo-1] + ' ' + y;
}

// ─── HISTORIAL PAGOS ─────────────────────────────────────────────────────────
function renderHist() {
  const tbody = document.getElementById('hist-body');
  const empty = document.getElementById('hist-empty');
  if (!pagos.length) { tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';
  const sorted = [...pagos.entries()].sort((a,b) => b[1].mes.localeCompare(a[1].mes));
  tbody.innerHTML = sorted.map(([real, p]) => `
    <tr>
      <td class="col-fecha">${fmtMes(p.mes)}</td>
      <td class="col-pza"><strong>${p.plaza}</strong></td>
      <td class="col-inq" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px">${p.nombre||'—'}</td>
      <td class="col-eur" style="text-align:right;font-weight:500">${parseFloat(p.importe).toFixed(0)}</td>
      <td class="col-est">
        <label style="cursor:pointer;display:flex;align-items:center;gap:3px;">
          <input type="checkbox" ${p.cobrado?'checked':''} data-pi="${real}" style="accent-color:#1D9E75;width:11px;height:11px;cursor:pointer;flex-shrink:0;">
          <span class="${p.cobrado?'badge-cobrado':'badge-pend'}">${p.cobrado?'Cobrado':'Pend.'}</span>
        </label>
      </td>
      <td class="col-del">
        <button class="btn-del-pago" data-delpago="${real}" title="Eliminar pago">✕</button>
      </td>
    </tr>`).join('');

  tbody.querySelectorAll('[data-pi]').forEach(cb => {
    cb.addEventListener('change', async e => {
      const idx = +e.target.dataset.pi;
      pagos[idx].cobrado = e.target.checked;
      // Actualizar en supabase si tiene id
      if (pagos[idx].sb_id) {
        try { await sbPatch('pagos', 'id', pagos[idx].sb_id, {cobrado: pagos[idx].cobrado}); } catch(err) { console.error(err); }
      }
      saveLocal(); renderHist();
    });
  });

  tbody.querySelectorAll('[data-delpago]').forEach(btn => {
    btn.addEventListener('click', async e => {
      const idx = +e.target.dataset.delpago;
      const pago = pagos[idx];
      if (pago.sb_id) {
        try { await sbDelete('pagos', 'id', pago.sb_id); } catch(err) { console.error(err); }
      }
      pagos.splice(idx, 1);
      saveLocal(); renderHist();
      toast('Pago eliminado', '#e24b4a');
    });
  });
}

document.getElementById('btn-add').addEventListener('click', async () => {
  const pl  = document.getElementById('p-plaza').value;
  const mes = getMesValor();
  const imp = parseFloat(document.getElementById('p-imp').value);
  if (!mes || !imp) { toast('Rellena mes e importe', '#BA7517'); return; }
  const p = plazas.find(x => x.id===pl);
  const nuevoPago = {plaza:pl, nombre:(p&&p.inquilino)||'—', mes, importe:imp, cobrado:false};
  // Insertar en supabase y obtener id
  try {
    setSyncDot('syncing');
    const res = await sbUpsert('pagos', [nuevoPago]);
    if (Array.isArray(res) && res[0]) nuevoPago.sb_id = res[0].id;
    setSyncDot('ok');
  } catch(err) {
    setSyncDot('err');
    console.error(err);
  }
  pagos.push(nuevoPago);
  document.getElementById('p-imp').value = '';
  saveLocal(); renderHist();
  toast('Pago añadido ✓', '#e8a84a');
});

// ─── BOTONES ─────────────────────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', () => saveToSupabase());

document.getElementById('btn-excel').addEventListener('click', () => {
  try {
    const wb = XLSX.utils.book_new();
    const wsRes = XLSX.utils.aoa_to_sheet([
      ['Cochera','Inquilino','Renta mensual (€)','Estado','Llave entregada','Observaciones'],
      ...plazas.map(p => [p.id, p.inquilino||'Libre', p.renta, p.estado, p.llave?'Sí':'No', p.obs||''])
    ]);
    wsRes['!cols'] = [{wch:10},{wch:14},{wch:18},{wch:12},{wch:15},{wch:30}];
    XLSX.utils.book_append_sheet(wb, wsRes, 'Resumen');
    const sorted = [...pagos].sort((a,b) => b.mes.localeCompare(a.mes));
    const wsSg = XLSX.utils.aoa_to_sheet([
      ['Mes','Plaza','Inquilino','Importe (€)','Cobrado'],
      ...sorted.map(p => [fmtMes(p.mes), p.plaza, p.nombre||'—', p.importe, p.cobrado?'Sí':'No'])
    ]);
    wsSg['!cols'] = [{wch:12},{wch:8},{wch:14},{wch:12},{wch:10}];
    XLSX.utils.book_append_sheet(wb, wsSg, 'Seguimiento mensual');
    const oc  = plazas.filter(p => p.estado==='ocupada').length;
    const ing = plazas.filter(p => p.estado==='ocupada').reduce((s,p) => s+(parseFloat(p.renta)||0), 0);
    const ll  = plazas.filter(p => p.llave).length;
    const wsDash = XLSX.utils.aoa_to_sheet([
      ['Dashboard Cocheras',''], ['Fecha exportación', new Date().toLocaleDateString('es-ES')], ['',''],
      ['Plazas ocupadas', `${oc}/${plazas.length}`], ['Ingresos mensuales (€)', ing],
      ['Ingresos anuales (€)', ing*12], ['Llaves entregadas', `${ll}/${plazas.length}`],
    ]);
    wsDash['!cols'] = [{wch:22},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsDash, 'Dashboard');
    XLSX.writeFile(wb, 'cocheras_dashboard.xlsx');
    toast('Excel descargado', '#185F2E');
  } catch(err) { toast('Error al exportar', '#A32D2D'); }
});

// ─── INIT ────────────────────────────────────────────────────────────────────
const hoy = new Date();
document.getElementById('fecha-hoy').textContent = hoy.toLocaleDateString('es-ES', {day:'2-digit', month:'short', year:'numeric'});
buildMesAnioSelects();
loadFromSupabase(); // carga datos de Supabase al arrancar
</script>
